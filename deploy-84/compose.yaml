# DB ASH Viewer (Oracle + PostgreSQL): https://84-54-28-45.sslip.io:95/ (nginx: /etc/nginx/sites-available/dbash-95)
# Каталог /opt/dbash: compose.yaml, .env (пароли), config/targets.json, src/ (код для образа).
# PostgreSQL 16 — внутри контейнера oracle11 (настройка: oracle11-pg/setup.sh); oracle11 подключён к сети dbash_default.
# Обновление: собрать образ из src (Dockerfile.patch), поменять тег ниже, `docker compose up -d`.
name: dbash

services:
  web:
    image: dbash-web:2026-10-10
    container_name: dbash
    env_file: .env
    environment:
      ASHV_MODE: normal            # список баз; базы сервера открываются без пароля (open_server_db)
    volumes:
      - ./config:/config:ro
      - dbash-data:/data
    ports:
      - "127.0.0.1:8095:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  dbash-data:
